<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0F172A"/>
  
  <!-- Ambient Radial Glow Orbs -->
  <circle cx="150" cy="100" r="300" fill="#10B981" opacity="0.15" filter="blur(80px)"/>
  <circle cx="1050" cy="530" r="280" fill="#6366F1" opacity="0.15" filter="blur(80px)"/>
  
  <!-- Subtle Grid Dots -->
  <pattern id="grid-dots" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#334155" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid-dots)"/>

  <!-- Logo Group -->
  <g transform="translate(100, 120)">
    <rect width="64" height="64" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <path d="M42 30C42 36.6274 35.732 42 28 42C25.569 42 23.2882 41.4606 21.3204 40.5048L14 43L16.5436 36.4732C14.9458 34.6146 14 32.409 14 30C14 23.3726 20.268 18 28 18C35.732 18 42 23.3726 42 30Z" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="16" r="6" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
    
    <text x="88" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Pingr <tspan fill="#10B981">AI</tspan></text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
    Turn Every Customer Conversation
  </text>
  <text x="100" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#10B981" letter-spacing="-1.5">
    Into Automated Action.
  </text>

  <!-- Subtitle -->
  <text x="100" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#94A3B8">
    WhatsApp Cloud API &bull; Conversational Voice AI &bull; Smart CRM Memory Sync
  </text>

  <!-- Feature Chips -->
  <g transform="translate(100, 470)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="230" height="48" rx="24" fill="#1E293B" stroke="#334155"/>
    <circle cx="24" cy="24" r="6" fill="#10B981"/>
    <text x="40" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">WhatsApp Business</text>

    <!-- Chip 2 -->
    <rect x="250" y="0" width="220" height="48" rx="24" fill="#1E293B" stroke="#334155"/>
    <circle cx="274" cy="24" r="6" fill="#6366F1"/>
    <text x="290" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Voice AI Agents</text>

    <!-- Chip 3 -->
    <rect x="490" y="0" width="240" height="48" rx="24" fill="#1E293B" stroke="#334155"/>
    <circle cx="514" cy="24" r="6" fill="#10B981"/>
    <text x="530" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">99.99% Uptime SLA</text>
  </g>
</svg>
