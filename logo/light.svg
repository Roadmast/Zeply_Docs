<svg width="140" height="36" viewBox="0 0 140 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ribbon-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stopColor="#7C3AED" />
      <stop offset="30%" stopColor="#6366F1" />
      <stop offset="70%" stopColor="#5842F5" />
      <stop offset="100%" stopColor="#4338CA" />
    </linearGradient>
    <linearGradient id="fold-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#4338CA" stopOpacity="0.85" />
      <stop offset="50%" stopColor="#4F46E5" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#6366F1" stopOpacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Official Sayvy Ribbon Icon -->
  <g transform="translate(2, 5) scale(0.26)">
    <!-- Top fold of S ribbon -->
    <path
      d="M 68 14 C 42 14 26 26 26 40 C 26 50 36 57 52 61 L 64 64 C 74 66.5 80 72 80 80 C 80 92 66 100 48 100 C 34 100 24 94 18 86"
      stroke="url(#ribbon-grad)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- 3D Fold Transition Layer -->
    <path
      d="M 32 36 C 42 28 58 24 72 26 C 62 34 46 44 38 52 C 32 58 28 66 26 74"
      fill="none"
      stroke="url(#fold-grad)"
      stroke-width="10"
      stroke-linecap="round"
      opacity="0.6"
    />
    <!-- Bottom Speech Bubble Base Fold -->
    <path
      d="M 22 72 C 22 66 26 62 32 62 L 56 62 C 64 62 70 68 70 76 C 70 84 64 90 56 90 L 32 90 C 25 90 22 84 22 78 Z"
      fill="url(#ribbon-grad)"
    />
    <!-- Chat Bubble Three Dots -->
    <circle cx="35" cy="76" r="3.2" fill="#FFFFFF" />
    <circle cx="46" cy="76" r="3.2" fill="#FFFFFF" />
    <circle cx="57" cy="76" r="3.2" fill="#FFFFFF" />
  </g>
  <!-- Sayvy AI Brand Typography -->
  <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#0F172A">Say</tspan><tspan fill="#5842F5">vy</tspan> <tspan fill="#64748B" font-size="15" font-weight="700">AI</tspan>
  </text>
</svg>
